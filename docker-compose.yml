services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports:
      - "5432:5432"               # опционально, для отладки
    networks:
      - micro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orders"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  product-service:
    build: ./product-service
    networks:
      - micro-net
    expose:
      - "8000"
    restart: unless-stopped

  discount-service:
    build: ./discount-service
    networks:
      - micro-net
    expose:
      - "8000"
    restart: unless-stopped

  order-service:
    build: ./order-service
    ports:
      - "8002:8000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
      DISCOUNT_SERVICE_URL: http://discount-service:8000
      DATABASE_URL: postgresql://app:app@postgres:5432/orders
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started 
      discount-service:
        condition: service_started
    networks:
      - micro-net
    restart: unless-stopped

networks:
  micro-net:
    driver: bridge